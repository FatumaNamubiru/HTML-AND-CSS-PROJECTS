<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Effects Challenge</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>CSS Effects Challenge</h1>
        <p>Creative image hover effects</p>
    </header>

    <main>
        <section class="content">
            <h2>Explore Beautiful Places</h2>

            <p>
                Hover pseudo-class and CSS transformations.
            </p>

            <div class="image-gallery">

                <div class="image-box">
                    <img src="images/image1.jpg" alt="Beautiful mountain landscape">
                    <h3>Scale Effect</h3>
                </div>

                <div class="image-box rotate">
                    <img src="images/image2.jpg" alt="Beautiful nature scene">
                    <h3>Rotate Effect</h3>
                </div>

                <div class="image-box color-change">
                    <img src="images/image3.jpg" alt="Beautiful lake scenery">
                    <h3>Color Effect</h3>
                </div>

            </div>
        </section>
    </main>

</body>
</html>
